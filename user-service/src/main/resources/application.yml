server:
  port: ${SERVER_PORT:0}

spring:
  application:
    name: user-service
  servlet:
    multipart:
      max-file-size: ${AVATAR_MAX_FILE_SIZE:5MB}
      max-request-size: ${AVATAR_MAX_FILE_SIZE:5MB}

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        register-enabled: true
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/blog_cloud?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql

mybatis:
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,prometheus}
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.userservice: info

auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  token-session:
    fail-open-on-redis-error: true
    local-cache-seconds: 300

app:
  avatar:
    upload-dir: ${AVATAR_UPLOAD_DIR:${user.dir}/run-logs/avatar-uploads}
    max-size-bytes: ${AVATAR_MAX_SIZE_BYTES:5242880}
    allowed-extensions: jpg,jpeg,png,webp,gif
    allowed-content-types: image/jpeg,image/png,image/webp,image/gif
