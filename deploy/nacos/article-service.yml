server:
  port: 8082

spring:
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://elasticsearch:9200}
  data:
    elasticsearch:
      repositories:
        enabled: false
  cloud:
    openfeign:
      circuitbreaker:
        enabled: false
      httpclient:
        enabled: true
        max-connections: ${FEIGN_HTTPCLIENT_MAX_CONNECTIONS:200}
        max-connections-per-route: ${FEIGN_HTTPCLIENT_MAX_CONNECTIONS_PER_ROUTE:50}
        connection-timeout: ${FEIGN_HTTPCLIENT_CONNECTION_TIMEOUT:2000}
        hc5:
          enabled: true
          socket-timeout: ${FEIGN_HTTPCLIENT_SOCKET_TIMEOUT:3000}
          socket-timeout-unit: milliseconds
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000
    sentinel:
      enabled: ${SENTINEL_ENABLED:true}
      transport:
        dashboard: ${SENTINEL_DASHBOARD:sentinel-dashboard:8858}
        port: ${SENTINEL_TRANSPORT_PORT:8719}
      eager: true
      filter:
        enabled: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    enabled: true

logging:
  level:
    com.articleservice: info

# Retained for legacy non-Feign protection; Feign calls use Sentinel.
resilience4j:
  circuitbreaker:
    instances:
      user-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  retry:
    instances:
      user-service:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2

article:
  heat:
    refresh-fixed-delay-ms: 1800000
    refresh-initial-delay-ms: 300000

feign:
  sentinel:
    enabled: ${FEIGN_SENTINEL_ENABLED:true}
