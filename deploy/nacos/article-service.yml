server:
  port: 8082

spring:
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://elasticsearch:9200}
  data:
    elasticsearch:
      repositories:
        enabled: false
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    enabled: true

logging:
  level:
    com.articleservice: info

resilience4j:
  circuitbreaker:
    instances:
      user-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  retry:
    instances:
      user-service:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2

article:
  heat:
    refresh-fixed-delay-ms: 1800000
    refresh-initial-delay-ms: 300000
