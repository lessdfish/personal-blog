server:
  port: 8083

spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
    loadbalancer:
      cache:
        enabled: true
        caffeine:
          spec: initialCapacity=32,maximumSize=256,expireAfterWrite=30s
      retry:
        enabled: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    enabled: true

feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 3000

logging:
  level:
    com.commentservice: info

resilience4j:
  circuitbreaker:
    instances:
      user-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      article-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  retry:
    instances:
      user-service:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2
      article-service:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2
