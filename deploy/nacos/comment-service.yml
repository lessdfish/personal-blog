server:
  port: 8083

spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: false
      httpclient:
        enabled: true
        max-connections: ${FEIGN_HTTPCLIENT_MAX_CONNECTIONS:200}
        max-connections-per-route: ${FEIGN_HTTPCLIENT_MAX_CONNECTIONS_PER_ROUTE:50}
        connection-timeout: ${FEIGN_HTTPCLIENT_CONNECTION_TIMEOUT:2000}
        hc5:
          enabled: true
          socket-timeout: ${FEIGN_HTTPCLIENT_SOCKET_TIMEOUT:3000}
          socket-timeout-unit: milliseconds
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000
    loadbalancer:
      cache:
        enabled: true
        caffeine:
          spec: initialCapacity=32,maximumSize=256,expireAfterWrite=30s
      retry:
        enabled: true
    sentinel:
      enabled: ${SENTINEL_ENABLED:true}
      transport:
        dashboard: ${SENTINEL_DASHBOARD:sentinel-dashboard:8858}
        port: ${SENTINEL_TRANSPORT_PORT:8719}
      eager: true
      filter:
        enabled: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    enabled: true

logging:
  level:
    com.commentservice: info

# Retained for legacy non-Feign protection; Feign calls use Sentinel.
resilience4j:
  circuitbreaker:
    instances:
      user-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      article-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  retry:
    instances:
      user-service:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2
      article-service:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2

feign:
  sentinel:
    enabled: ${FEIGN_SENTINEL_ENABLED:true}
