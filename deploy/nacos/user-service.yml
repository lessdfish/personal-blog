server:
  port: 8081

spring:
  servlet:
    multipart:
      max-file-size: ${AVATAR_MAX_FILE_SIZE:5MB}
      max-request-size: ${AVATAR_MAX_FILE_SIZE:5MB}

pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql

mybatis:
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    enabled: true

logging:
  level:
    com.userservice: info

app:
  avatar:
    upload-dir: ${AVATAR_UPLOAD_DIR:/app/data/avatars}
    max-size-bytes: ${AVATAR_MAX_SIZE_BYTES:5242880}
    allowed-extensions: jpg,jpeg,png,webp,gif
    allowed-content-types: image/jpeg,image/png,image/webp,image/gif
