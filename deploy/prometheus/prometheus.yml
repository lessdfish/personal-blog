global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: blog-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["blog-gateway:18080"]

  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["user-service:8081"]

  - job_name: article-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["article-service:8082"]

  - job_name: comment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["comment-service:8083"]

  - job_name: notify-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notify-service:8084"]
