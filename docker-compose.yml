services:
  mysql:
    image: mysql:8.4
    container_name: blog-mysql
    restart: unless-stopped
    mem_limit: ${MYSQL_MEMORY_LIMIT:-768m}
    cpus: ${MYSQL_CPUS:-1.0}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog_cloud}
      MYSQL_USER: ${MYSQL_APP_USERNAME:-blog_cloud}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-change-app-password}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-256M}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: unless-stopped
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    cpus: ${REDIS_CPUS:-0.5}
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else
        exec redis-server --appendonly yes;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3-management
    container_name: blog-rabbitmq
    restart: unless-stopped
    mem_limit: ${RABBITMQ_MEMORY_LIMIT:-512m}
    cpus: ${RABBITMQ_CPUS:-1.0}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-blog_cloud}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-rabbitmq-password}
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 30s
      retries: 20
      start_period: 90s

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: blog-nacos
    restart: unless-stopped
    mem_limit: ${NACOS_MEMORY_LIMIT:-768m}
    cpus: ${NACOS_CPUS:-1.0}
    environment:
      MODE: standalone
      SPRING_PROFILES_ACTIVE: standalone
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-true}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-blog-cloud}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-change-this-to-a-long-random-string-at-least-32-chars}
      JVM_XMS: ${NACOS_JVM_XMS:-128m}
      JVM_XMX: ${NACOS_JVM_XMX:-256m}
      JVM_XMN: ${NACOS_JVM_XMN:-64m}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${NACOS_PUBLIC_PORT:-8848}:8848"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/v1/console/health/readiness >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: blog-elasticsearch
    restart: unless-stopped
    mem_limit: ${ELASTICSEARCH_MEMORY_LIMIT:-1g}
    cpus: ${ELASTICSEARCH_CPUS:-1.5}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20

  zipkin:
    image: openzipkin/zipkin:3
    container_name: blog-zipkin
    restart: unless-stopped
    mem_limit: ${ZIPKIN_MEMORY_LIMIT:-384m}
    cpus: ${ZIPKIN_CPUS:-0.5}
    ports:
      - "${ZIPKIN_PORT:-9411}:9411"

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: blog-prometheus
    restart: unless-stopped
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-256m}
    cpus: ${PROMETHEUS_CPUS:-0.5}
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
    depends_on:
      blog-gateway:
        condition: service_started
      user-service:
        condition: service_started
      article-service:
        condition: service_started
      comment-service:
        condition: service_started
      notify-service:
        condition: service_started

  grafana:
    image: grafana/grafana:10.4.0
    container_name: blog-grafana
    restart: unless-stopped
    mem_limit: ${GRAFANA_MEMORY_LIMIT:-256m}
    cpus: ${GRAFANA_CPUS:-0.5}
    ports:
      - "${GRAFANA_PORT:-13000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started

  user-service:
    build:
      context: .
      dockerfile: docker/backend-service.Dockerfile
      args:
        SERVICE_MODULE: user-service
        SERVICE_PORT: 8081
    container_name: blog-user-service
    restart: unless-stopped
    mem_limit: ${USER_SERVICE_MEMORY_LIMIT:-512m}
    cpus: ${USER_SERVICE_CPUS:-1.0}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      JAVA_OPTS: ${USER_SERVICE_JAVA_OPTS:--Xms128m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=96m -XX:ActiveProcessorCount=2 -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs -XX:+ExitOnOutOfMemoryError}
      TZ: ${TZ:-Asia/Shanghai}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      NACOS_CONFIG_GROUP: ${NACOS_CONFIG_GROUP:-BLOG_CLOUD}
      NACOS_DISCOVERY_GROUP: ${NACOS_DISCOVERY_GROUP:-BLOG_CLOUD}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog_cloud}
      MYSQL_USERNAME: ${MYSQL_APP_USERNAME:-blog_cloud}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-change-app-password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Lax}
      AVATAR_UPLOAD_DIR: /app/data/avatars
    volumes:
      - avatar-data:/app/data/avatars

  article-service:
    build:
      context: .
      dockerfile: docker/backend-service.Dockerfile
      args:
        SERVICE_MODULE: article-service
        SERVICE_PORT: 8082
    container_name: blog-article-service
    restart: unless-stopped
    mem_limit: ${ARTICLE_SERVICE_MEMORY_LIMIT:-512m}
    cpus: ${ARTICLE_SERVICE_CPUS:-1.0}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8082
      JAVA_OPTS: ${ARTICLE_SERVICE_JAVA_OPTS:--Xms128m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=96m -XX:ActiveProcessorCount=2 -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs -XX:+ExitOnOutOfMemoryError}
      TZ: ${TZ:-Asia/Shanghai}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      NACOS_CONFIG_GROUP: ${NACOS_CONFIG_GROUP:-BLOG_CLOUD}
      NACOS_DISCOVERY_GROUP: ${NACOS_DISCOVERY_GROUP:-BLOG_CLOUD}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog_cloud}
      MYSQL_USERNAME: ${MYSQL_APP_USERNAME:-blog_cloud}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-change-app-password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-blog_cloud}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-change-rabbitmq-password}
      ELASTICSEARCH_URIS: http://elasticsearch:9200

  comment-service:
    build:
      context: .
      dockerfile: docker/backend-service.Dockerfile
      args:
        SERVICE_MODULE: comment-service
        SERVICE_PORT: 8083
    container_name: blog-comment-service
    restart: unless-stopped
    mem_limit: ${COMMENT_SERVICE_MEMORY_LIMIT:-512m}
    cpus: ${COMMENT_SERVICE_CPUS:-1.0}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8083
      JAVA_OPTS: ${COMMENT_SERVICE_JAVA_OPTS:--Xms128m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=96m -XX:ActiveProcessorCount=2 -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs -XX:+ExitOnOutOfMemoryError}
      TZ: ${TZ:-Asia/Shanghai}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      NACOS_CONFIG_GROUP: ${NACOS_CONFIG_GROUP:-BLOG_CLOUD}
      NACOS_DISCOVERY_GROUP: ${NACOS_DISCOVERY_GROUP:-BLOG_CLOUD}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog_cloud}
      MYSQL_USERNAME: ${MYSQL_APP_USERNAME:-blog_cloud}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-change-app-password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-blog_cloud}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-change-rabbitmq-password}

  notify-service:
    build:
      context: .
      dockerfile: docker/backend-service.Dockerfile
      args:
        SERVICE_MODULE: notify-service
        SERVICE_PORT: 8084
    container_name: blog-notify-service
    restart: unless-stopped
    mem_limit: ${NOTIFY_SERVICE_MEMORY_LIMIT:-512m}
    cpus: ${NOTIFY_SERVICE_CPUS:-1.0}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8084
      JAVA_OPTS: ${NOTIFY_SERVICE_JAVA_OPTS:--Xms128m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=96m -XX:ActiveProcessorCount=2 -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs -XX:+ExitOnOutOfMemoryError}
      TZ: ${TZ:-Asia/Shanghai}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      NACOS_CONFIG_GROUP: ${NACOS_CONFIG_GROUP:-BLOG_CLOUD}
      NACOS_DISCOVERY_GROUP: ${NACOS_DISCOVERY_GROUP:-BLOG_CLOUD}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog_cloud}
      MYSQL_USERNAME: ${MYSQL_APP_USERNAME:-blog_cloud}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-change-app-password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-blog_cloud}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-change-rabbitmq-password}

  blog-gateway:
    build:
      context: .
      dockerfile: docker/backend-service.Dockerfile
      args:
        SERVICE_MODULE: blog-gateway
        SERVICE_PORT: 18080
    container_name: blog-gateway
    restart: unless-stopped
    mem_limit: ${BLOG_GATEWAY_MEMORY_LIMIT:-512m}
    cpus: ${BLOG_GATEWAY_CPUS:-1.0}
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      user-service:
        condition: service_started
      article-service:
        condition: service_started
      comment-service:
        condition: service_started
      notify-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 18080
      JAVA_OPTS: ${BLOG_GATEWAY_JAVA_OPTS:--Xms128m -Xmx256m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=96m -XX:MaxDirectMemorySize=128m -XX:ActiveProcessorCount=2 -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs -XX:+ExitOnOutOfMemoryError}
      TZ: ${TZ:-Asia/Shanghai}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      NACOS_CONFIG_GROUP: ${NACOS_CONFIG_GROUP:-BLOG_CLOUD}
      NACOS_DISCOVERY_GROUP: ${NACOS_DISCOVERY_GROUP:-BLOG_CLOUD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${GATEWAY_PUBLIC_PORT:-18080}:18080"

  blog-web:
    build:
      context: .
      dockerfile: blog-web/Dockerfile
    container_name: blog-web
    restart: unless-stopped
    mem_limit: ${BLOG_WEB_MEMORY_LIMIT:-128m}
    cpus: ${BLOG_WEB_CPUS:-0.5}
    depends_on:
      blog-gateway:
        condition: service_started
    ports:
      - "${WEB_PUBLIC_PORT:-80}:80"

  https-proxy:
    image: nginx:1.27-alpine
    container_name: blog-https-proxy
    restart: unless-stopped
    profiles:
      - https
    depends_on:
      blog-web:
        condition: service_started
      blog-gateway:
        condition: service_started
    ports:
      - "${HTTP_PROXY_PORT:-18082}:80"
      - "${HTTPS_PUBLIC_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  nacos-data:
  nacos-logs:
  avatar-data:
  elasticsearch-data:
  grafana-data:
