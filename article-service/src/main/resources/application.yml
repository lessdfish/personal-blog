server:
  port: ${SERVER_PORT:0}

spring:
  application:
    name: article-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    openfeign:
      circuitbreaker:
        enabled: false
      httpclient:
        enabled: true
        max-connections: ${FEIGN_HTTPCLIENT_MAX_CONNECTIONS:200}
        max-connections-per-route: ${FEIGN_HTTPCLIENT_MAX_CONNECTIONS_PER_ROUTE:50}
        connection-timeout: ${FEIGN_HTTPCLIENT_CONNECTION_TIMEOUT:2000}
        hc5:
          enabled: true
          socket-timeout: ${FEIGN_HTTPCLIENT_SOCKET_TIMEOUT:3000}
          socket-timeout-unit: milliseconds
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000
    sentinel:
      enabled: ${SENTINEL_ENABLED:true}
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
        port: ${SENTINEL_TRANSPORT_PORT:8719}
      eager: true
      filter:
        enabled: true
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://127.0.0.1:9200}
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/blog_cloud?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    elasticsearch:
      repositories:
        enabled: false
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

mybatis:
  configuration:
    map-underscore-to-camel-case: true
pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,prometheus}
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.articleservice: info

# Retained for legacy non-Feign protection; Feign calls use Sentinel.
resilience4j:
  circuitbreaker:
    instances:
      user-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  retry:
    instances:
      user-service:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2

auth:
  token-session:
    fail-open-on-redis-error: true
    local-cache-seconds: 300

article:
  heat:
    refresh-fixed-delay-ms: ${ARTICLE_HEAT_REFRESH_FIXED_DELAY_MS:1800000}
    refresh-initial-delay-ms: ${ARTICLE_HEAT_REFRESH_INITIAL_DELAY_MS:300000}

feign:
  sentinel:
    enabled: ${FEIGN_SENTINEL_ENABLED:true}
